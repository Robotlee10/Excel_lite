<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Cashier POS Terminal</title>
    <!-- HTML5 QR Code / Barcode Library for Camera Scanning -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        :root {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #16a34a;
            --success-hover: #15803d;
            --danger: #dc2626;
            --danger-hover: #b91c1c;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --warning: #ca8a04;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 1.5rem; line-height: 1.5; }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .top-bar h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; }

        .status-container { display: flex; align-items: center; gap: 0.75rem; }
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            padding: 0.35rem 0.85rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .status-online { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .status-offline { background-color: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }

        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 360px 1fr; gap: 1.5rem; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .sidebar { display: flex; flex-direction: column; gap: 1.25rem; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 1.25rem; box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .card h2 { font-size: 1.1rem; font-weight: 600; }

        .toggle-btn { background: none; border: none; font-size: 0.85rem; color: var(--primary); font-weight: 600; cursor: pointer; }

        .form-group { margin-bottom: 0.75rem; }
        label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.25rem; color: #334155; text-transform: uppercase; letter-spacing: 0.025em; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 0.5rem 0.625rem; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; background-color: #fff; }
        input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }

        .btn { border: none; border-radius: 6px; padding: 0.625rem 1rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 0.375rem; }
        .btn-primary { background-color: var(--primary); color: white; width: 100%; margin-top: 0.25rem; }
        .btn-primary:hover { background-color: var(--primary-hover); }
        .btn-success { background-color: var(--success); color: white; }
        .btn-success:hover { background-color: var(--success-hover); }
        .btn-secondary { background-color: #475569; color: white; }
        .btn-secondary:hover { background-color: #334155; }
        .btn-danger { background-color: var(--danger); color: white; }
        .btn-danger:hover { background-color: var(--danger-hover); }

        .table-container { overflow-x: auto; margin-top: 0.75rem; border: 1px solid var(--border); border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.875rem; text-align: left; }
        th { background-color: #f8fafc; padding: 0.75rem 1rem; font-weight: 600; color: #475569; border-bottom: 1px solid var(--border); }
        td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #f8fafc; }

        .sync-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
        .synced-true { background-color: var(--success); }
        .synced-false { background-color: var(--warning); }

        .hidden-form { display: none; }

        /* Camera Scanner Modal Styles */
        #cameraScannerContainer {
            display: none;
            background: #f8fafc;
            border: 1px dashed var(--primary);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 1rem;
            text-align: center;
        }

        /* Printable Receipt Thermal Design */
        #receiptContainer { display: none; }

        .receipt-card {
            width: 300px;
            background: #ffffff;
            padding: 15px;
            color: #000;
            font-size: 12px;
            font-family: 'Courier New', Courier, monospace;
            margin: 0 auto;
        }

        .receipt-card * { font-family: 'Courier New', Courier, monospace !important; }
        .store-header { text-align: center; margin-bottom: 10px; }
        .store-title { font-size: 14px; font-weight: bold; }
        .divider { border-bottom: 1px dashed #000; margin: 8px 0; }
        .item-row { display: flex; justify-content: space-between; margin-bottom: 4px; }

        @media print {
            @page { size: auto; margin: 0; }
            body * { visibility: hidden; }
            #receiptContainer, #receiptContainer * { visibility: visible; }
            #receiptContainer { display: flex !important; justify-content: center; position: absolute; left: 0; top: 0; width: 100vw; background: white; padding-top: 10px; }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <h1>Cashier POS Terminal</h1>
            <p style="color: var(--text-muted); font-size: 0.85rem;">Press <kbd>F2</kbd> anywhere to print selected items receipt</p>
        </div>
        <div class="status-container">
            <span id="networkStatus" class="status-badge status-online">● Online</span>
            <span id="pendingCount" class="status-badge status-offline">0 Unsynced</span>
        </div>
    </div>
    
    <div class="container">
        <div class="sidebar">
            <!-- Terminal Config -->
            <div class="card">
                <div class="card-header">
                    <h2>Store Configuration</h2>
                    <button type="button" class="toggle-btn" id="toggleSettingsBtn" onclick="toggleStoreSettings()">Hide</button>
                </div>
                
                <form id="storeSettingsForm">
                    <div class="form-group">
                        <label for="storeName">Store Name</label>
                        <input type="text" id="storeName" value="Central Mart Terminal" required>
                    </div>
                    <div class="form-group">
                        <label for="storeAddress">Address</label>
                        <input type="text" id="storeAddress" value="Plot 12 Commercial Way, Lagos" required>
                    </div>
                    <div class="form-group">
                        <label for="salesPerson">Cashier Name</label>
                        <input type="text" id="salesPerson" value="Admin" required>
                    </div>
                    <button type="submit" class="btn btn-secondary" style="width: 100%;">Save Config</button>
                </form>
            </div>

            <!-- Item Entry Form -->
            <div class="card">
                <div class="card-header">
                    <h2>Scan / Add Item</h2>
                    <button type="button" class="btn btn-secondary" style="font-size: 0.75rem; padding: 0.3rem 0.6rem;" onclick="toggleCameraScanner()">📷 Camera</button>
                </div>

                <!-- Camera Reader Container -->
                <div id="cameraScannerContainer">
                    <div id="interactive-reader" style="width: 100%; max-width: 320px; margin: 0 auto;"></div>
                    <button type="button" class="btn btn-danger" style="margin-top: 8px; width: 100%; padding: 0.3rem;" onclick="toggleCameraScanner()">Close Camera</button>
                </div>

                <form id="cashierForm" style="margin-top: 0.75rem;">
                    <div class="form-group">
                        <label for="itemName">Item Name / Barcode</label>
                        <input type="text" id="itemName" placeholder="Scan hardware barcode or type..." autofocus autocomplete="off" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category">
                            <option value="Groceries">Groceries</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Apparel">Apparel</option>
                            <option value="General">General</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="quantity">Qty</label>
                            <input type="number" id="quantity" step="1" min="1" value="1" required>
                        </div>
                        <div class="form-group">
                            <label for="price">Price (₦)</label>
                            <input type="number" id="price" step="0.01" min="0" placeholder="0.00" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Item to Cart</button>
                </form>
            </div>
        </div>

        <!-- Sales Log -->
        <div class="card">
            <div class="card-header">
                <h2>Transaction History</h2>
                <div style="display: flex; gap: 0.5rem;">
                    <button type="button" class="btn btn-secondary" onclick="printReceipt('selected')">Print Selected (F2)</button>
                    <button type="button" class="btn btn-success" onclick="exportToCSV()">Export CSV</button>
                    <button type="button" class="btn btn-danger" onclick="clearLocalBuffer()">Clear Queue</button>
                </div>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th style="width: 30px; text-align: center;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                            <th style="width: 20px;"></th>
                            <th>Receipt #</th>
                            <th>Item Name</th>
                            <th>Qty</th>
                            <th>Price</th>
                            <th>Total</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Thermal Print Layout -->
    <div id="receiptContainer">
        <div class="receipt-card">
            <div class="store-header">
                <div class="store-title" id="receiptStoreName">Central Mart</div>
                <div id="receiptStoreAddress">Lagos</div>
                <div>SALE RECEIPT</div>
            </div>
            <div class="divider"></div>
            <div id="receiptDate"></div>
            <div id="receiptCashier"></div>
            <div class="divider"></div>
            <div id="receiptItemList"></div>
            <div class="divider"></div>
            <div class="item-row" style="font-weight: bold;">
                <div>GRAND TOTAL:</div>
                <div id="receiptGrandTotal">₦0.00</div>
            </div>
        </div>
    </div>

    <script>
        // IndexedDB Initialization
        function openIndexedDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open("POSLocalDB", 1);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains("orders")) {
                        const store = db.createObjectStore("orders", { keyPath: "client_uuid" });
                        store.createIndex("synced", "synced", { unique: false });
                    }
                };
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        let storeSettings = JSON.parse(localStorage.getItem('cashier_store_settings')) || {
            storeName: "Central Mart Terminal",
            storeAddress: "Plot 12 Commercial Way, Lagos",
            salesPerson: "Admin"
        };

       // Initialize from browser cache (localStorage) or default empty object
let mockProductCatalog = JSON.parse(localStorage.getItem('cached_products')) || {};

// Fetch latest products from Render/Supabase
async function refreshProductCatalog() {
    if (!navigator.onLine) return;

    try {
        const res = await fetch("https://excel-lite.onrender.com/api/v1/products");
        if (res.ok) {
            const data = await res.json();
            mockProductCatalog = data;
            // Cache locally so barcode scanning works offline
            localStorage.setItem('cached_products', JSON.stringify(data));
            console.log("Product catalog synced from database!");
        }
    } catch (err) {
        console.log("Using cached product catalog.");
    }
}

// Fetch products when app loads
window.onload = () => {
    renderTable();
    syncOfflineOrders();
    refreshProductCatalog();
    setInterval(syncOfflineOrders, 20000);
};

        function toggleStoreSettings() {
            const form = document.getElementById('storeSettingsForm');
            const btn = document.getElementById('toggleSettingsBtn');
            form.classList.toggle('hidden-form');
            btn.innerText = form.classList.contains('hidden-form') ? 'Show' : 'Hide';
        }

        document.getElementById('storeSettingsForm').addEventListener('submit', (e) => {
            e.preventDefault();
            storeSettings = {
                storeName: document.getElementById('storeName').value,
                storeAddress: document.getElementById('storeAddress').value,
                salesPerson: document.getElementById('salesPerson').value
            };
            localStorage.setItem('cashier_store_settings', JSON.stringify(storeSettings));
            alert("Settings updated!");
        });

        // Barcode Hardware Gun Event Handling
        const itemNameInput = document.getElementById('itemName');

        itemNameInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const code = this.value.trim();
                if (!code) return;

                if (mockProductCatalog[code]) {
                    const p = mockProductCatalog[code];
                    document.getElementById('itemName').value = p.name;
                    document.getElementById('price').value = p.price;
                    document.getElementById('category').value = p.category;
                    
                    // Trigger record save immediately for scanned item
                    saveTransactionRecord(p.name, p.category, 1, p.price, p.product_id);
                    this.value = '';
                } else {
                    // Manual item entry fallback if code isn't in catalog
                    if (document.getElementById('price').value) {
                        document.getElementById('cashierForm').requestSubmit();
                    }
                }
            }
        });

        async function saveTransactionRecord(name, category, qty, price, productId = 1) {
            const total = qty * price;
            const record = {
                client_uuid: crypto.randomUUID(),
                receipt_number: "POS-" + Math.floor(100000 + Math.random() * 900000),
                item_name: name,
                category: category,
                quantity: qty,
                price: price,
                subtotal: total,
                grand_total: total,
                created_at: new Date().toISOString(),
                synced: 0,
                items: [{ product_id: productId, quantity: qty, unit_price: price, subtotal: total }]
            };

            const db = await openIndexedDB();
            const tx = db.transaction("orders", "readwrite");
            await tx.objectStore("orders").add(record);

            document.getElementById('cashierForm').reset();
            document.getElementById('quantity').value = "1";
            itemNameInput.focus();

            renderTable();
            syncOfflineOrders();
        }

        async function addTransaction(e) {
            e.preventDefault();
            const qty = parseFloat(document.getElementById('quantity').value);
            const price = parseFloat(document.getElementById('price').value);
            const name = document.getElementById('itemName').value;
            const category = document.getElementById('category').value;

            await saveTransactionRecord(name, category, qty, price, 1);
        }

        document.getElementById('cashierForm').addEventListener('submit', addTransaction);

        // Camera Scanner Integration
        let html5QrCode = null;

        function toggleCameraScanner() {
            const container = document.getElementById('cameraScannerContainer');
            if (container.style.display === 'none' || container.style.display === '') {
                container.style.display = 'block';
                html5QrCode = new Html5Qrcode("interactive-reader");
                
                const config = { fps: 10, qrbox: { width: 250, height: 150 } };
                html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    (decodedText) => {
                        if (mockProductCatalog[decodedText]) {
                            const p = mockProductCatalog[decodedText];
                            saveTransactionRecord(p.name, p.category, 1, p.price, p.product_id);
                        } else {
                            itemNameInput.value = decodedText;
                        }
                        toggleCameraScanner();
                    },
                    (errorMessage) => {}
                ).catch(err => console.error("Camera permissions error:", err));
            } else {
                if (html5QrCode) {
                    html5QrCode.stop().then(() => {
                        container.style.display = 'none';
                    }).catch(() => {
                        container.style.display = 'none';
                    });
                } else {
                    container.style.display = 'none';
                }
            }
        }

        async function getLocalOrders() {
            const db = await openIndexedDB();
            return new Promise((resolve) => {
                const tx = db.transaction("orders", "readonly");
                const req = tx.objectStore("orders").getAll();
                req.onsuccess = () => resolve(req.result || []);
            });
        }

        async function renderTable() {
            const transactions = await getLocalOrders();
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';

            let unsyncedCount = 0;

            transactions.forEach(item => {
                if (!item.synced) unsyncedCount++;
                const row = `<tr>
                    <td style="text-align: center;"><input type="checkbox" class="item-checkbox" value="${item.client_uuid}"></td>
                    <td style="text-align: center;"><span class="sync-dot ${item.synced === 1 ? 'synced-true' : 'synced-false'}"></span></td>
                    <td>${item.receipt_number}</td>
                    <td>${item.item_name}</td>
                    <td>${item.quantity}</td>
                    <td>₦${item.price.toFixed(2)}</td>
                    <td><strong>₦${item.grand_total.toFixed(2)}</strong></td>
                </tr>`;
                tbody.innerHTML += row;
            });

            document.getElementById('pendingCount').innerText = `${unsyncedCount} Unsynced`;
        }

        async function syncOfflineOrders() {
            if (!navigator.onLine) {
                document.getElementById('networkStatus').className = 'status-badge status-offline';
                document.getElementById('networkStatus').innerText = '● Offline Mode';
                return;
            }

            document.getElementById('networkStatus').className = 'status-badge status-online';
            document.getElementById('networkStatus').innerText = '● Online';

            const db = await openIndexedDB();
            const tx = db.transaction("orders", "readonly");
            const index = tx.objectStore("orders").index("synced");

            const unsyncedOrders = await new Promise((res) => {
                const req = index.getAll(0);
                req.onsuccess = () => res(req.result);
            });

            if (unsyncedOrders.length === 0) return;

            try {
                const response = await fetch("https://excel-lite.onrender.com/api/v1/sync/orders", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(unsyncedOrders)
                });

                const result = await response.json();
                if (response.ok && result.synced_uuids) {
                    const writeTx = db.transaction("orders", "readwrite");
                    const store = writeTx.objectStore("orders");
                    for (const uuid of result.synced_uuids) {
                        const item = await new Promise((r) => {
                            const req = store.get(uuid);
                            req.onsuccess = () => r(req.result);
                        });
                        if (item) {
                            item.synced = 1;
                            store.put(item);
                        }
                    }
                    renderTable();
                }
            } catch (err) {
                console.log("Backend offline; transactions queued in browser.");
            }
        }

        function toggleSelectAll(master) {
            document.querySelectorAll('.item-checkbox').forEach(cb => cb.checked = master.checked);
        }

        async function printReceipt() {
            const selected = Array.from(document.querySelectorAll('.item-checkbox:checked')).map(cb => cb.value);
            const transactions = await getLocalOrders();
            const itemsToPrint = transactions.filter(t => selected.includes(t.client_uuid));

            if (itemsToPrint.length === 0) {
                alert("Select items using checkboxes to print receipt.");
                return;
            }

            document.getElementById('receiptStoreName').innerText = storeSettings.storeName;
            document.getElementById('receiptStoreAddress').innerText = storeSettings.storeAddress;
            document.getElementById('receiptCashier').innerText = "Cashier: " + storeSettings.salesPerson;
            document.getElementById('receiptDate').innerText = "Date: " + new Date().toLocaleString();

            const listContainer = document.getElementById('receiptItemList');
            listContainer.innerHTML = '';
            let grandTotal = 0;

            itemsToPrint.forEach(item => {
                grandTotal += item.grand_total;
                listContainer.innerHTML += `
                    <div class="item-row">
                        <div>${item.item_name} (x${item.quantity})</div>
                        <div>₦${item.grand_total.toFixed(2)}</div>
                    </div>
                `;
            });

            document.getElementById('receiptGrandTotal').innerText = `₦${grandTotal.toFixed(2)}`;
            window.print();
        }

        async function clearLocalBuffer() {
            if (confirm("Clear all locally stored transactions?")) {
                const db = await openIndexedDB();
                const tx = db.transaction("orders", "readwrite");
                tx.objectStore("orders").clear();
                renderTable();
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === 'F2') {
                e.preventDefault();
                printReceipt();
            }
        });

        window.addEventListener("online", syncOfflineOrders);
        window.addEventListener("offline", syncOfflineOrders);

        window.onload = () => {
            renderTable();
            syncOfflineOrders();
            setInterval(syncOfflineOrders, 20000);
        };
    </script>
</body>
</html>
